  <!-- ══════════════════════════ MAIN AREA ══════════════════════════ -->
  <div class="shell-main" id="shell-main">

    <!-- Topbar -->
    <header class="topbar" role="banner">
      <!-- Mobile-only hamburger (opens sidebar overlay) -->
      <button class="topbar-hamburger" id="topbar-hamburger-btn" aria-label="Open navigation">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <line x1="3" y1="6" x2="21" y2="6" />
          <line x1="3" y1="12" x2="21" y2="12" />
          <line x1="3" y1="18" x2="21" y2="18" />
        </svg>
      </button>

      <!-- Topbar right: datetime + user dropdown -->
      <div class="topbar-right">

        <div class="topbar-datetime" id="topbar-datetime" aria-live="polite" aria-atomic="true"></div>

        <div class="topbar-user">
          <button class="user-btn" id="user-btn" aria-expanded="false" aria-haspopup="true">
            <!-- Avatar initials -->
            <span class="user-avatar" aria-hidden="true">
              {{ session.get('username', 'A')[0].upper() }}
            </span>
            <span class="user-name">{{ session.get('username', 'Admin') }}</span>
            <svg class="caret" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <polyline points="6 9 12 15 18 9" />
            </svg>
          </button>

          <div class="user-dropdown" id="user-dropdown" role="menu">
            <a href="/profile" role="menuitem" id="profile-link">
              <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" />
              </svg>
              Profile
            </a>
            <a href="{{ url_for('auth.logout') }}" role="menuitem" id="topbar-logout-link" class="logout-link">
              <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                <polyline points="16 17 21 12 16 7" />
                <line x1="21" y1="12" x2="9" y2="12" />
              </svg>
              Logout
            </a>
          </div>
        </div>

      </div>
    </header>

    <!-- Page content -->
    <main class="content-area" role="main" id="content-area">
      {% block content %}{% endblock %}
    </main>

  </div><!-- /.shell-main -->

  <!-- ── Shell JS (datetime, dropdown, sidebar collapse/mobile) ── -->
  <script>
    (function () {
      'use strict';

      /* ── 1. Live clock ────────────────────────────────────────────── */
      var dateEl = document.getElementById('topbar-datetime');
      var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      function updateClock() {
        var n = new Date();
        var d = String(n.getDate()).padStart(2, '0');
        var m = MONTHS[n.getMonth()];
        var y = n.getFullYear();
        var hr = n.getHours();
        var min = String(n.getMinutes()).padStart(2, '0');
        var sec = String(n.getSeconds()).padStart(2, '0');
        var ampm = hr >= 12 ? 'PM' : 'AM';
        hr = hr % 12 || 12;
        dateEl.textContent = d + ' ' + m + ' ' + y + ' \u00B7 ' + hr + ':' + min + ':' + sec + ' ' + ampm;
      }
      updateClock();
      setInterval(updateClock, 1000);

      /* ── 2. User dropdown ─────────────────────────────────────────── */
      var userBtn = document.getElementById('user-btn');
      var userDd = document.getElementById('user-dropdown');
      userBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        var open = userDd.classList.toggle('open');
        userBtn.setAttribute('aria-expanded', String(open));
      });
      document.addEventListener('click', function () {
        userDd.classList.remove('open');
        userBtn.setAttribute('aria-expanded', 'false');
      });
      userDd.addEventListener('click', function (e) { e.stopPropagation(); });

      /* ── 3. Sidebar collapse (desktop) ───────────────────────────── */
      var collapseBtn = document.getElementById('sidebar-collapse-btn');
      var topbarHamBtn = document.getElementById('topbar-hamburger-btn');
      var sidebar = document.getElementById('sidebar');
      var overlay = document.getElementById('sidebar-overlay');
      var sidebarCollapsed = false;

      function setCollapsed(val) {
        sidebarCollapsed = val;
        document.body.classList.toggle('sidebar-collapsed', val);
        collapseBtn.setAttribute('aria-label', val ? 'Expand sidebar' : 'Collapse sidebar');
        try { localStorage.setItem('itms-sidebar-collapsed', val ? '1' : '0'); } catch (e) { }
      }

      // Restore saved state
      try {
        if (localStorage.getItem('itms-sidebar-collapsed') === '1') setCollapsed(true);
      } catch (e) { }

      collapseBtn.addEventListener('click', function () {
        if (window.innerWidth <= 960) {
          closeMobileSidebar();  // collapse btn acts as close on mobile
        } else {
          setCollapsed(!sidebarCollapsed);
        }
      });

      /* ── 4. Mobile sidebar ───────────────────────────────────────── */
      function openMobileSidebar() {
        sidebar.classList.add('mobile-open');
        overlay.classList.add('visible');
        overlay.removeAttribute('aria-hidden');
        document.body.style.overflow = 'hidden';
      }

      function closeMobileSidebar() {
        sidebar.classList.remove('mobile-open');
        overlay.classList.remove('visible');
        overlay.setAttribute('aria-hidden', 'true');
        document.body.style.overflow = '';
      }

      topbarHamBtn.addEventListener('click', openMobileSidebar);
      overlay.addEventListener('click', closeMobileSidebar);

      // Close mobile sidebar on resize to desktop
      window.addEventListener('resize', function () {
        if (window.innerWidth > 960) closeMobileSidebar();
      });

    })();
  </script>

  {% block extra_scripts %}{% endblock %}
</body>
